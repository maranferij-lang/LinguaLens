<svg xmlns="http://www.w3.org/2000/svg" viewBox="152 156 720 720" width="720" height="720">
  <!-- Знак «Лінго» — голова з іконки (icon-lingo.svg) двома кольорами, для
       малих розмірів: водяний знак на картках і наліпках (LogoMark у
       src/Logo.js, 16–22 pt) і монохромна іконка Android
       (tools/export-brand.mjs). Координати — ті самі, що в іконці.
       #silhouette — голова з гребенем і очі-турелі (колір знака);
       #cutouts — очні яблука й усміхнений рот, «вирізані» кольором тла;
       #pupils — зіниці кольором знака, зведені до носа, як в іконці.
       Обідок ока й зіниця трохи більші, ніж в іконці: на 16 pt вони інакше
       тоншають до пів пікселя. Геометрію з src/Logo.js (MARK) звіряє
       __tests__/sharedParts.test.js. -->
  <g id="silhouette" fill="#1F1B16">
    <path d="M512 178 C562 178 590 222 616 258 C734 276 826 362 844 492 C864 646 770 850 512 854 C254 850 160 646 180 492 C198 362 290 276 408 258 C434 222 462 178 512 178 Z"/>
    <circle cx="316" cy="418" r="146"/>
    <circle cx="708" cy="418" r="146"/>
  </g>
  <g id="cutouts" fill="#FFFFFF">
    <circle cx="314" cy="422" r="106"/>
    <circle cx="710" cy="422" r="106"/>
    <path d="M300 626 C390 662 634 662 724 626 C696 732 604 776 512 776 C420 776 328 732 300 626 Z"/>
  </g>
  <g id="pupils" fill="#1F1B16">
    <circle cx="336" cy="428" r="68"/>
    <circle cx="688" cy="428" r="68"/>
  </g>
</svg>
